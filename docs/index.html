<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radar de obras industriales</title>
  <meta name="description" content="Mapa 3D de proyectos de construcción y expansión en minería, energía y oil & gas en Argentina y países limítrofes, armado a partir de noticias.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23061A33'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%233FE0C5' stroke-width='1.5'/%3E%3Cpath d='M16 16 L16 1 A15 15 0 0 1 29 9 Z' fill='%233FE0C5' opacity='.6'/%3E%3Ccircle cx='21' cy='11' r='2' fill='%23FF7A1A'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>

  <!-- Pantalla de inicio: radar -->
  <section class="intro" id="intro" aria-label="Inicio">
    <div class="intro-inner">
      <div class="scope" id="scope" aria-hidden="true">
        <div class="rings"></div>
        <div class="cross"></div>
        <div class="sweep" id="sweep"></div>
        <div class="blips" id="blips"></div>
      </div>
      <div class="intro-copy">
        <h1>Radar de obras</h1>
        <p class="lede">Dónde se están construyendo o ampliando plantas de minería, energía y oil &amp; gas en Argentina, Chile, Bolivia, Paraguay, Uruguay y Brasil, según las noticias.</p>
        <button type="button" class="start" id="start">Iniciar radar</button>
        <ol class="log" id="log" aria-live="polite"></ol>
      </div>
    </div>
  </section>

  <!-- Mapa -->
  <main class="app" id="app" aria-hidden="true">
    <div id="map" aria-label="Mapa 3D de actividad"></div>

    <header class="hud top">
      <div class="brand">
        <strong>Radar de obras</strong>
        <span id="updated"></span>
      </div>
      <div class="filters">
        <div class="chips" id="f-sector" role="group" aria-label="Sector"></div>
        <div class="segmented" id="f-period" role="group" aria-label="Período"></div>
      </div>
    </header>

    <nav class="hud levels" aria-label="Nivel de detalle">
      <span class="levels-label">Viendo</span>
      <div class="segmented" id="levels"></div>
      <span class="hint" id="level-hint"></span>
    </nav>

    <div class="hud legend" aria-label="Referencias">
      <ul id="legend"></ul>
      <p>La altura de cada punto es la cantidad de noticias.</p>
    </div>

    <aside class="drawer" id="drawer" aria-label="Detalle">
      <div class="drawer-head" id="drawer-head"></div>
      <div class="drawer-body" id="drawer-body"></div>
    </aside>

    <div class="tip" id="tip" role="tooltip" hidden></div>
    <div class="notice" id="notice" hidden></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
